<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Připravujeme něco nového</title>
    <style>
        /* Reset a základní styly */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* Ambientní záře na pozadí */
        .background-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Hlavní kontejner */
        .container {
            text-align: center;
            position: relative;
            z-index: 2;
            max-width: 500px;
        }

        /* Pulzující indikátor stavu */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #9ca3af;
            margin-bottom: 32px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
            animation: pulse 2s infinite;
        }

        /* Nadpisy a texty */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.05rem;
            color: #9ca3af;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Jemná dělicí linka */
        .divider {
            height: 1px;
            width: 40px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 32px auto;
        }

        /* Animace pro pulzující tečku */
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(99, 102, 241, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        /* Responzivita pro mobily */
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="container">
        <div class="status-badge">
            <span class="pulse-dot"></span>
            Aktuálně nedostupné
        </div>
        
        <h1>Připravujeme<br>něco nového</h1>
        
        <div class="divider"></div>
        
        <p>Tento web momentálně prochází úpravami. Usilovně pracujeme na nové verzi, abychom vám přinesli mnohem lepší zážitek. <br> Děkujeme za trpělivost.</p>
    </div>

</body>
</html>
